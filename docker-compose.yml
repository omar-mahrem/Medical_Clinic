services:
  clinic-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clinic-sqlserver
    restart: always
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?copy .env.example to .env and set MSSQL_SA_PASSWORD}
    ports:
      - "14333:1433"
    volumes:
      - clinic_sql_data:/var/opt/mssql/data
    networks:
      - clinic-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  clinic-api:
    build:
      context: .
      dockerfile: MedicalClinic.Api/Dockerfile
    container_name: clinic-backend
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=clinic-db,1433;Database=MedicalClinicDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?copy .env.example to .env and set MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true;
      - ConnectionStrings__HangfireConnection=Server=clinic-db,1433;Database=MedicalClinicDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?copy .env.example to .env and set MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:?copy .env.example to .env and set JWT_KEY}
      - MailSettings__Password=${MAIL_APP_PASSWORD:?copy .env.example to .env and set MAIL_APP_PASSWORD}
      - HangfireSettings__Username=${HANGFIRE_USERNAME:-admin}
      - HangfireSettings__Password=${HANGFIRE_PASSWORD:?copy .env.example to .env and set HANGFIRE_PASSWORD}
    depends_on:
      clinic-db:
        condition: service_healthy
    networks:
      - clinic-network

  clinic-client:
    build:
      context: ./MedicalClinic.Client
      dockerfile: Dockerfile
    container_name: clinic-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - clinic-api
    networks:
      - clinic-network

volumes:
  clinic_sql_data:

networks:
  clinic-network:
    driver: bridge

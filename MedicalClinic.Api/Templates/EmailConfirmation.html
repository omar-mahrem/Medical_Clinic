<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .card {
            max-width: 480px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
        }

        .header {
            background: linear-gradient(to right, #4776E6, #8E54E9);
            padding: 40px;
            text-align: center;
            color: white;
        }

        .header-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        .content {
            padding: 40px;
        }

        .data-card {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #e6e9ff;
        }

        .data-row {
            display: flex;
            margin-bottom: 10px;
        }

        .data-label {
            font-weight: 600;
            color: #555;
            width: 120px;
        }

        .data-value {
            color: #333;
            font-family: monospace;
        }

        .verify-btn {
            display: block;
            width: 100%;
            background: linear-gradient(to right, #4776E6, #8E54E9);
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            margin: 30px 0;
            transition: all 0.3s;
        }

            .verify-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 7px 14px rgba(50, 50, 93, 0.1), 0 3px 6px rgba(0, 0, 0, 0.08);
            }

        .footer {
            text-align: center;
            padding: 25px;
            background: #f8f9ff;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 520px) {
            .content {
                padding: 25px;
            }

            .header {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-icon">✅</div>
        <h1>Email Verification</h1>
    </div>

    <div class="content">
        <p>Hello {{name}}, please verify your email address by clicking the button below:</p>

        <form action="YOUR_API_ENDPOINT" method="POST">
            <a href="{{action_url}}"
               class="f-fallback button button--green"
               target="_blank">Verify email address</a>
            <button type="submit" class="verify-btn">Verify Email</button>
        </form>

        <p style="text-align: center; color: #666; font-size: 14px;">
            If you didn't sign up, you can safely ignore this email.
        </p>
    </div>

    <div class="footer">
        <p>Medical Clinic</p>
        <p style="font-size: 12px; opacity: 0.7;">This link expires in 24 hours</p>
        <p style="font-size: 12px; opacity: 0.7;">{{action_url}}</p>

    </div>
</body>
</html>
